# Recordatorio a la guardia si no cargó el parte de turno.
name: Recordatorio de parte de turno

on:
  workflow_dispatch:

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl -sS \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/recordatorio-parte"
